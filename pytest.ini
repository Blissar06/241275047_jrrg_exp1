[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 用 markers 给测试分类：方便按方法学一次跑一组
markers =
    unit: 单元测试（针对单一函数/方法的最小独立测试）
    integration: 集成测试（跨模块端到端）
    blackbox: 黑盒测试（不依赖实现细节）
    whitebox: 白盒测试（基于代码路径/分支/条件）
    equivalence: 等价类划分（黑盒子类）
    boundary: 边界值分析（黑盒子类）
    decision_table: 决策表测试（黑盒子类）
    scenario: 场景法测试（黑盒子类）
    path: 基本路径覆盖（白盒子类）
    condition: 条件组合覆盖（白盒子类）
    property: 属性测试（hypothesis 驱动）
    perf: 性能基准（pytest-benchmark）
    slow: 耗时较长测试（默认可选择性跳过）

# 严格 markers：拼错的 marker 直接报错
addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    # streamlit 的废弃 warning 影响 pytest 报告整洁度
    ignore::DeprecationWarning:streamlit.*
