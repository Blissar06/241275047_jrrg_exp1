name: CI

on:
  push:
    branches: [main, dev, "frosty-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov hypothesis pytest-benchmark

      - name: Lint syntax (basic)
        run: |
          python -m compileall -q data_model strategy backtest report data ui

      - name: Run unit + integration tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/perf \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Run performance benchmarks (no fail, info only)
        run: |
          pytest tests/perf --benchmark-only --benchmark-min-rounds=2 -q || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (informational)
        run: ruff check . || true   # 不阻断 CI；后续 codebase 整治后改为强制
